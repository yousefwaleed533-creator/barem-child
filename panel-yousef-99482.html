<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الخاصة</title>
    <!-- منع محركات البحث من أرشفة أو إظهار هذه الصفحة نهائياً -->
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0F172A; color: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .login-box {
            background: #1E293B;
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .login-box h2 { margin-bottom: 10px; color: #38BDF8; }
        .login-box p { color: #94A3B8; margin-bottom: 25px; font-size: 0.95rem; }
        input[type="password"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0F172A;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #38BDF8;
            color: #0F172A;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #0284C7; color: white; }

        .dashboard { display: none; width: 100%; max-width: 850px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 1.8rem; color: #38BDF8; }
        .refresh-btn { width: auto; padding: 10px 20px; font-size: 0.95rem; background: #10B981; color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: #1E293B;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #334155;
            text-align: center;
        }
        .stat-card h3 { color: #94A3B8; font-size: 1rem; margin-bottom: 10px; }
        .stat-card .num { font-size: 2.8rem; font-weight: 800; color: #38BDF8; }
        .stat-card.downloads .num { color: #10B981; }
        .stat-card.rate .num { color: #F59E0B; }

        .logs-box { background: #1E293B; padding: 25px; border-radius: 20px; border: 1px solid #334155; }
        .logs-box h3 { margin-bottom: 15px; color: #E2E8F0; }
        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
            color: #CBD5E1;
        }
        .log-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <div class="login-box" id="loginBox">
        <h2>🔐 دخول المشرف</h2>
        <p>منطقة محمية - تطبيق برعم الطفل</p>
        <input type="password" id="passInput" placeholder="أدخل رمز الأمان">
        <button onclick="checkLogin()">تأكيد الدخول</button>
        <p id="errorMsg" style="color: #EF4444; margin-top: 10px; display: none;">رمز الأمان غير صحيح!</p>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>📊 إحصائيات برعم الطفل</h1>
            <button class="refresh-btn" onclick="loadStats()">🔄 تحديث الأرقام</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الزيارات</h3>
                <div class="num" id="visitsCount">...</div>
            </div>
            <div class="stat-card downloads">
                <h3>إجمالي التحميلات</h3>
                <div class="num" id="downloadsCount">...</div>
            </div>
            <div class="stat-card rate">
                <h3>نسبة التحميل</h3>
                <div class="num" id="conversionRate">0%</div>
            </div>
        </div>

        <div class="logs-box">
            <h3>🕒 آخر النشاطات (من متصفحك)</h3>
            <div id="logsList">جاري التحميل...</div>
        </div>
    </div>

<script>
    // البصمة المشفرة SHA-256 لكلمة السر الجديدة
    const SECRET_HASH = "e25b789a250a69533528c682b270cf6dc74c31e2c5258d76b332ed9be1a1e042";
    const NAMESPACE = 'barem_child_yousef_2026';

    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkLogin() {
        const input = document.getElementById('passInput').value;
        const inputHash = await sha256(input);
        
        if (inputHash === SECRET_HASH) {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadStats();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
            document.getElementById('passInput').value = '';
        }
    }

    document.getElementById('passInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') checkLogin();
    });

    async function loadStats() {
        document.getElementById('visitsCount').innerText = '...';
        document.getElementById('downloadsCount').innerText = '...';

        try {
            const [vRes, dRes] = await Promise.all([
                fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/visits`),
                fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/downloads`)
            ]);
            
            const vData = await vRes.json();
            const dData = await dRes.json();

            const visits = vData.count || 0;
            const downloads = dData.count || 0;

            document.getElementById('visitsCount').innerText = visits;
            document.getElementById('downloadsCount').innerText = downloads;

            const rate = visits > 0 ? Math.round((downloads / visits) * 100) : 0;
            document.getElementById('conversionRate').innerText = rate + '%';
        } catch (err) {
            document.getElementById('visitsCount').innerText = '0';
            document.getElementById('downloadsCount').innerText = '0';
        }

        const logs = JSON.parse(localStorage.getItem('barem_logs') || '[]');
        const logsList = document.getElementById('logsList');
        if (logs.length
