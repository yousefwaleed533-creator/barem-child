<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الخاصة</title>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background: #0F172A; color: #F8FAFC; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .login-box {
            background: #1E293B;
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .login-box h2 { margin-bottom: 10px; color: #38BDF8; }
        .login-box p { color: #94A3B8; margin-bottom: 25px; font-size: 0.95rem; }
        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #475569;
            background: #0F172A;
            color: white;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 15px;
            direction: ltr;
        }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: #38BDF8;
            color: #0F172A;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }

        .dashboard { display: none; width: 100%; max-width: 850px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        .header h1 { font-size: 1.8rem; color: #38BDF8; }
        .refresh-btn { width: auto; padding: 10px 20px; font-size: 0.95rem; background: #10B981; color: white; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: #1E293B;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #334155;
            text-align: center;
        }
        .stat-card h3 { color: #94A3B8; font-size: 1rem; margin-bottom: 10px; }
        .stat-card .num { font-size: 2.8rem; font-weight: 800; color: #38BDF8; }
        .stat-card.downloads .num { color: #10B981; }
        .stat-card.rate .num { color: #F59E0B; }

        .logs-box { background: #1E293B; padding: 25px; border-radius: 20px; border: 1px solid #334155; }
        .logs-box h3 { margin-bottom: 15px; color: #E2E8F0; }
        .log-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
            color: #CBD5E1;
        }
    </style>
</head>
<body>

    <div class="login-box" id="loginBox">
        <h2>🔐 دخول المشرف</h2>
        <p>منطقة محمية - تطبيق برعم الطفل</p>
        <input type="password" id="passInput" placeholder="أدخل رمز الأمان" inputmode="numeric">
        <button id="loginBtn" type="button">تأكيد الدخول</button>
        <p id="errorMsg" style="color: #EF4444; margin-top: 10px; display: none;">رمز الأمان غير صحيح!</p>
    </div>

    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>📊 إحصائيات برعم الطفل</h1>
            <button id="refreshBtn" type="button" class="refresh-btn">🔄 تحديث الأرقام</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الزيارات</h3>
                <div class="num" id="visitsCount">...</div>
            </div>
            <div class="stat-card downloads">
                <h3>إجمالي التحميلات</h3>
                <div class="num" id="downloadsCount">...</div>
            </div>
            <div class="stat-card rate">
                <h3>نسبة التحميل</h3>
                <div class="num" id="conversionRate">0%</div>
            </div>
        </div>

        <div class="logs-box">
            <h3>🕒 آخر النشاطات (من متصفحك)</h3>
            <div id="logsList">جاري التحميل...</div>
        </div>
    </div>

<script>
    (function() {
        const NAMESPACE = 'barem_child_yousef_2026';
        // تمثيل مشفر للرمز 23122010
        const CHECK_VAL = [50, 51, 49, 50, 50, 48, 49, 48];

        function verify(str) {
            // تحويل الأرقام العربية إلى إنجليزية تلقائياً إن وجدت
            const clean = str.trim().replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
            if (clean.length !== CHECK_VAL.length) return false;
            for (let i = 0; i < clean.length; i++) {
                if (clean.charCodeAt(i) !== CHECK_VAL[i]) return false;
            }
            return true;
        }

        function attemptLogin() {
            const input = document.getElementById('passInput').value;
            const err = document.getElementById('errorMsg');
            if (verify(input)) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadStats();
            } else {
                err.style.display = 'block';
                document.getElementById('passInput').value = '';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', attemptLogin);
        document.getElementById('passInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') attemptLogin();
        });
        document.getElementById('refreshBtn').addEventListener('click', loadStats);

        async function loadStats() {
            document.getElementById('visitsCount').innerText = '...';
            document.getElementById('downloadsCount').innerText = '...';

            try {
                const [vRes, dRes] = await Promise.all([
                    fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/visits`),
                    fetch(`https://api.counterapi.dev/v1/${NAMESPACE}/downloads`)
                ]);
                const vData = await vRes.json();
                const dData = await dRes.json();

                const visits = vData.count || 0;
                const downloads = dData.count || 0;

                document.getElementById('visitsCount').innerText = visits;
                document.getElementById('downloadsCount').innerText = downloads;
                document.getElementById('conversionRate').innerText = (visits > 0 ? Math.round((downloads / visits) * 100) : 0) + '%';
            } catch (err) {
                document.getElementById('visitsCount').innerText = '0';
                document.getElementById('downloadsCount').innerText = '0';
            }

            const logs = JSON.parse(localStorage.getItem('barem_logs') || '[]');
            const logsList = document.getElementById('logsList');
            logsList.innerHTML = logs.length === 0 
                ? '<p style="color:#64748B;">لا توجد نشاطات مسجلة محلياً بعد.</p>'
                : logs.map(l => `<div class="log-item"><span>${l.type}</span><span style="color:#94A3B8; direction:ltr;">${l.time}</span></div>`).join('');
        }
    })();
</script>

</body>
</html>
